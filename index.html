<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de clientes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="logo">
        <img src= "img/petshop.jpg" class="logo">
    </div>

    <header id="main-hader">
        <h1>★ Snack Pets Store ★ ᓚᘏᗢ </h1>
        <p> Bocadillos y regalitos para tu mascota </p>
    </header>

     <div class="container">
        <h1> Registrese </h1>
        <p> Obtenga 10% descuento por primera compra </p>

        <form id="formProducto">
            <div class="campo">
            <label for="correo"> Correo </label>
            <input
                type="text"
                id="correo"
                name="correo"
                placeholder="Ingrese correo">
            <span id="errorCorreo" class="error"> </span>
            </div>
        </form>

    <div class="galeria"> 
        <img src="https://cdn.pixabay.com/photo/2017/04/30/18/33/kittens-2273598_1280.jpg" class="thumb">
    </div>
    <div class="login"> 
        <a href="#mascotas"> Mascotas felices </a>
        <a href="#registro"> Registrarse </a>
    </div>

    
    
</body>
</html>
